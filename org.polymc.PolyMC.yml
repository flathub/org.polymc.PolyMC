app-id: org.polymc.PolyMC
runtime: org.kde.Platform
runtime-version: "5.15-24.08"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
  - org.freedesktop.Sdk.Extension.openjdk17
  - org.freedesktop.Sdk.Extension.openjdk8

command: polymc
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --socket=pulseaudio
    # for Discord RPC mods
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
    # Mod drag&drop
  - --filesystem=xdg-download:ro
    # PATH
  - --env=PATH=/app/bin:/usr/lib/extensions/vulkan/MangoHud/bin:/usr/lib/extensions/vulkan/gamescope/bin:/usr/bin
    # Gamescope
  - --env=LD_LIBRARY_PATH=/usr/lib/extensions/vulkan/gamescope/lib
    # MangoHud
  - --filesystem=xdg-config/MangoHud:ro

modules:
  # Compile PolyMC
  - name: compile
    buildsystem: cmake-ninja
    config-opts:
      - -DLauncher_BUILD_PLATFORM=flatpak
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    build-options:
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        JAVA_COMPILER: /usr/lib/sdk/openjdk17/jvm/openjdk-17/bin/javac
    sources:
      - type: git
        url: https://github.com/PolyMC/PolyMC.git
        tag: 7.0
  - name: openjdk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jdk/
      - /usr/lib/sdk/openjdk21/install.sh
      - mv /app/jre /app/jdk/21
      - /usr/lib/sdk/openjdk17/install.sh
      - mv /app/jre /app/jdk/17
      - /usr/lib/sdk/openjdk8/install.sh
      - mv /app/jre /app/jdk/8
    cleanup: [/jre]
  - name: xrandr
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/app/xrandr-1.5.3.tar.xz
        sha256: f8dd7566adb74147fab9964680b6bbadee87cf406a7fcff51718a5e6949b841c
    cleanup: [/share/man, /bin/xkeystone]
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-sd-bus-provider=no-daemon
      - -Dwith-examples=false
    sources:
      - type: git
        url: https://github.com/FeralInteractive/gamemode
        tag: "1.8.2"
  - name: gamemoderun
    buildsystem: simple
    build-commands:
      - install -Dm755 data/gamemoderun -t /app/bin
    sources:
      - type: git
        url: https://github.com/FeralInteractive/gamemode
        tag: 1.8.2
  - name: enhance
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - install -Dm755 prime-run /app/bin/prime-run
      - mv /app/bin/polymc /app/bin/polyrun
      - install -Dm755 polymc /app/bin/polymc
    sources:
      - type: file
        path: prime-run
      - type: file
        path: polymc
